name: firebase_stacktrace_decoder

version: 0.2.0

description: firebase stack trace decoder

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  args: ^2.5.0
  bloc_concurrency: ^0.2.5
  cross_file: ^0.3.4+2
  desktop_drop: ^0.5.0
  dotted_border: ^2.1.0
  equatable: ^2.0.7
  fading_edge_scrollview: ^4.1.1
  file_picker: ^8.1.4
  flutter_bloc: ^8.1.6
  get: ^4.6.6
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  intl: any
  list_ext: ^1.0.6
  logging: ^1.3.0
  loader_overlay: ^4.0.1
  meta: ^1.15.0
  multiple_localization: ^0.6.0
  multi_split_view: ^3.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  string_ext: ^0.2.0
  tabbed_view: ^1.18.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.8.2
  flutter_test:
    sdk: flutter

flutter_icons:
  image_path: "assets/dash.png"
  windows:
    generate: true
    image_path: "assets/dash.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/dash.png"
  linux:
    generate: true
    image_path: "assets/dash.png"

flutter:
  uses-material-design: true
  assets:
    - assets/dash.png
